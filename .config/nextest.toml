# cargo-nextest, run by scripts/test (docs/architecture.md section 13.4).
[profile.default]
fail-fast = false
# A test whose children still hold its stdout or stderr a second after it ends fails. A
# child that closed them is found by the process sweep of scripts/test instead.
leak-timeout = { period = "1s", result = "fail" }
# No test waits forever: after 5 minutes it is killed.
slow-timeout = { period = "60s", terminate-after = 5 }

# The Linux bind-mount tests, and the tests that need a user namespace or ext4, write whether
# their assertions ran or why they were skipped (docs/architecture.md section 13.5); show it
# for a passing test. Only test names select them: a binary or package that matches nothing is
# an error, and the self-check runs the canaries with this file too.
[[profile.default.overrides]]
filter = 'test(=bind_mounts_are_not_entered) | test(=bind_mounts_are_not_listed) | test(=walk_does_not_list_a_mount_made_after_its_check) | test(=refusals::a_root_directory) | test(=freed_bytes::ext4_extents)'
success-output = "immediate"
