[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/shuymn/cardinal"
publish = false

[workspace.dependencies]
assert_cmd = "2.2.2"
base64 = "0.23.1"
cardinal-test-support = { path = "crates/test-support" }
clap = { version = "4.6.8", features = ["derive"] }
dunce = "1.0.5"
libc = "0.2.191"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFURL", "CFString", "CFNumber", "CFDictionary", "CFArray", "CFError"] }
proptest = "1.12.0"
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "job-object"] }
rustix = { version = "1.1.6", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = { version = "0.4.6", default-features = false }
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.2.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
# A glob import brings modules into scope without a path tests/layering.rs can see.
wildcard_imports = "deny"
# The library target exists for integration tests and is not a published API, so its
# functions do not document error and panic conditions for outside callers.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
