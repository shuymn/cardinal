name: Release

# release-please keeps a release PR open on main. Merging it makes release-please
# tag the merge and create a draft release; the build jobs then build `cardinal`
# from that tag, and the publish job attaches the archives and their checksums and
# publishes the release. Releases are immutable once published, so the assets go on
# while the release is a draft.
#
# On pull requests only the build jobs run, without uploading anything, so each
# target is known to build before a release depends on it.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

# A push to main is never cancelled: a cancelled run could leave a release
# unpublished. A pending run that a newer one replaces needs no rerun either:
# release-please in the newer run still tags any merged release PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # An App token, not GITHUB_TOKEN: a pull request opened with GITHUB_TOKEN
      # starts no workflows, so the release PR would never get its required checks.
      # Commits the App creates through the API are signed, as main requires.
      - name: Create App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # release-please-config.json uses the `simple` release type: the `rust` type
      # fails on a virtual workspace root. Its extra files set the version in
      # `[workspace.package]` and in Cargo.lock; the Cargo.lock filter reads
      # `name.value` because release-please parses TOML into tagged values. Should
      # an update stop matching, the release PR's checks fail on `--locked`.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # One job per target. No cache: a release is built from a clean target directory.
  build:
    name: Build (${{ matrix.target }})
    needs: release-please
    if: >-
      !cancelled() &&
      (github.event_name == 'pull_request' || needs.release-please.outputs.release_created == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      # Only rust is installed; `mise exec` must not install the other tools.
      MISE_EXEC_AUTO_INSTALL: "false"
    steps:
      # The release tag on a release, fully qualified so that a branch of the same
      # name cannot take its place; the pull request's merge commit otherwise.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name && format('refs/tags/{0}', needs.release-please.outputs.tag_name) || '' }}
          persist-credentials: false

      # A release is built from the commit release-please tagged.
      - name: Check the release commit
        if: needs.release-please.outputs.release_created == 'true'
        env:
          SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          head=$(git rev-parse HEAD)
          if [ "$head" != "$SHA" ]; then
            echo "checked out $head, but the release commit is $SHA" >&2
            exit 1
          fi

      - name: Set up mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
          install_args: rust

      - name: Build
        run: mise exec -- cargo build --release --locked -p cardinal --bin cardinal

      # The runner's host must be the target the archive is named for, and a
      # release's binary must report the tagged version.
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          host=$(mise exec -- rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != "$TARGET" ]; then
            echo "built for $host, not $TARGET" >&2
            exit 1
          fi
          version=$(target/release/cardinal --version)
          echo "$version"
          if [ -n "$TAG" ] && [ "$version" != "cardinal ${TAG#v}" ]; then
            echo "the binary reports '$version', not the tag $TAG" >&2
            exit 1
          fi
          name="cardinal-$TARGET"
          mkdir -p "dist/$name"
          if [ "$ARCHIVE" = zip ]; then
            cp target/release/cardinal.exe "dist/$name/"
          else
            cp target/release/cardinal "dist/$name/"
          fi
          cp LICENSE README.md "dist/$name/"
          cd dist
          if [ "$ARCHIVE" = zip ]; then
            pwsh -NoProfile -Command "Compress-Archive -Path '$name' -DestinationPath '$name.zip'"
          else
            # No AppleDouble (._*) entries for extended attributes on macOS.
            COPYFILE_DISABLE=1 tar -czf "$name.tar.gz" "$name"
          fi
          echo "ARCHIVE_PATH=dist/$name.$ARCHIVE" >>"$GITHUB_ENV"

      - name: Upload archive
        if: needs.release-please.outputs.release_created == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cardinal-${{ matrix.target }}
          path: ${{ env.ARCHIVE_PATH }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cardinal-*
          merge-multiple: true
          path: dist

      - name: Attach archives and publish the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          archives=(
            cardinal-aarch64-apple-darwin.tar.gz
            cardinal-x86_64-unknown-linux-gnu.tar.gz
            cardinal-x86_64-pc-windows-msvc.zip
          )
          sha256sum "${archives[@]}" >SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" "${archives[@]}" SHA256SUMS --clobber
          gh release edit "$TAG" --draft=false
