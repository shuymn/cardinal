name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # One job per OS instead of a matrix: a matrix leg cancelled before it gets
  # a runner can still leave the matrix's aggregate result as `success`.
  test-macos:
    name: Test (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      # Only rust and cargo-nextest are installed; `mise exec` must not install the other
      # tools.
      MISE_EXEC_AUTO_INSTALL: "false"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
          install_args: rust github:nextest-rs/nextest

      # The toolchain is part of the key through mise.lock, so a toolchain
      # update starts a fresh target directory.
      - name: Compute cache key
        id: cache-key
        env:
          CARGO_LOCK_HASH: ${{ hashFiles('Cargo.lock') }}
          MISE_LOCK_HASH: ${{ hashFiles('mise.lock') }}
        run: |
          if [ -z "$CARGO_LOCK_HASH" ] || [ -z "$MISE_LOCK_HASH" ]; then
            echo "Cargo.lock or mise.lock is missing" >&2
            exit 1
          fi
          echo "key=cargo-$RUNNER_OS-$RUNNER_ARCH-$CARGO_LOCK_HASH-$MISE_LOCK_HASH" >>"$GITHUB_OUTPUT"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache-key.outputs.key }}

      - name: Run checks
        run: mise exec -- scripts/test

      # The isolation mechanisms themselves: each canary escape must fail or be caught.
      - name: Self-check the test harness
        run: mise exec -- scripts/test --self-check

      # A second run started the way a careless caller would: BASH_ENV names a script that
      # leaves a mark, and GIT_DIR, GIT_WORK_TREE, and GIT_INDEX_FILE point at a decoy
      # repository. No startup file may run, and neither the decoy nor this checkout may
      # change.
      - name: Run checks with a hostile environment
        run: |
          decoy="$RUNNER_TEMP/decoy"
          git init -q -b main "$decoy"
          git -C "$decoy" -c user.name=decoy -c user.email=decoy@example.invalid \
            commit -q --allow-empty -m decoy
          scripts/repo-guard snapshot "$decoy" "$RUNNER_TEMP/decoy.snapshot"
          printf 'echo ran >"%s"\n' "$RUNNER_TEMP/startup-ran" >"$RUNNER_TEMP/startup"
          BASH_ENV="$RUNNER_TEMP/startup" ENV="$RUNNER_TEMP/startup" \
            GIT_DIR="$decoy/.git" GIT_WORK_TREE="$decoy" GIT_INDEX_FILE="$decoy/.git/index" \
            mise exec -- scripts/test
          test ! -e "$RUNNER_TEMP/startup-ran"
          scripts/repo-guard verify "$decoy" "$RUNNER_TEMP/decoy.snapshot"

  test-linux:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      # Only rust and cargo-nextest are installed; `mise exec` must not install the other
      # tools.
      MISE_EXEC_AUTO_INSTALL: "false"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
          install_args: rust github:nextest-rs/nextest

      # The toolchain is part of the key through mise.lock, so a toolchain
      # update starts a fresh target directory.
      - name: Compute cache key
        id: cache-key
        env:
          CARGO_LOCK_HASH: ${{ hashFiles('Cargo.lock') }}
          MISE_LOCK_HASH: ${{ hashFiles('mise.lock') }}
        run: |
          if [ -z "$CARGO_LOCK_HASH" ] || [ -z "$MISE_LOCK_HASH" ]; then
            echo "Cargo.lock or mise.lock is missing" >&2
            exit 1
          fi
          echo "key=cargo-$RUNNER_OS-$RUNNER_ARCH-$CARGO_LOCK_HASH-$MISE_LOCK_HASH" >>"$GITHUB_OUTPUT"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache-key.outputs.key }}

      # bubblewrap confines each test process, and the bind-mount tests create a user and
      # mount namespace inside that confinement. Ubuntu restricts unprivileged user
      # namespaces through AppArmor, which both need: the sysctl for every program, and the
      # bwrap profile for what bwrap runs, which may not use capabilities in a namespace it
      # creates. Lift both on the runner.
      - name: Install bubblewrap
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ -e /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
          fi

      - name: Run checks
        run: mise exec -- scripts/test

      # The isolation mechanisms themselves: each canary escape must fail or be caught.
      - name: Self-check the test harness
        run: mise exec -- scripts/test --self-check

      # A second run started the way a careless caller would: BASH_ENV names a script that
      # leaves a mark, and GIT_DIR, GIT_WORK_TREE, and GIT_INDEX_FILE point at a decoy
      # repository. No startup file may run, and neither the decoy nor this checkout may
      # change.
      - name: Run checks with a hostile environment
        run: |
          decoy="$RUNNER_TEMP/decoy"
          git init -q -b main "$decoy"
          git -C "$decoy" -c user.name=decoy -c user.email=decoy@example.invalid \
            commit -q --allow-empty -m decoy
          scripts/repo-guard snapshot "$decoy" "$RUNNER_TEMP/decoy.snapshot"
          printf 'echo ran >"%s"\n' "$RUNNER_TEMP/startup-ran" >"$RUNNER_TEMP/startup"
          BASH_ENV="$RUNNER_TEMP/startup" ENV="$RUNNER_TEMP/startup" \
            GIT_DIR="$decoy/.git" GIT_WORK_TREE="$decoy" GIT_INDEX_FILE="$decoy/.git/index" \
            mise exec -- scripts/test
          test ! -e "$RUNNER_TEMP/startup-ran"
          scripts/repo-guard verify "$decoy" "$RUNNER_TEMP/decoy.snapshot"

  test-windows:
    name: Test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      # Only rust and cargo-nextest are installed; `mise exec` must not install the other
      # tools.
      MISE_EXEC_AUTO_INSTALL: "false"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
          install_args: rust github:nextest-rs/nextest

      # The toolchain is part of the key through mise.lock, so a toolchain
      # update starts a fresh target directory.
      - name: Compute cache key
        id: cache-key
        env:
          CARGO_LOCK_HASH: ${{ hashFiles('Cargo.lock') }}
          MISE_LOCK_HASH: ${{ hashFiles('mise.lock') }}
        run: |
          if [ -z "$CARGO_LOCK_HASH" ] || [ -z "$MISE_LOCK_HASH" ]; then
            echo "Cargo.lock or mise.lock is missing" >&2
            exit 1
          fi
          echo "key=cargo-$RUNNER_OS-$RUNNER_ARCH-$CARGO_LOCK_HASH-$MISE_LOCK_HASH" >>"$GITHUB_OUTPUT"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache-key.outputs.key }}

      # Windows cannot start an extensionless script directly, so sh runs it.
      - name: Run checks
        run: mise exec -- sh scripts/test

      # The isolation mechanisms themselves: each canary escape must fail or be caught.
      - name: Self-check the test harness
        run: mise exec -- sh scripts/test --self-check

      # A second run started the way a careless caller would: BASH_ENV names a script that
      # leaves a mark, and GIT_DIR, GIT_WORK_TREE, and GIT_INDEX_FILE point at a decoy
      # repository. No startup file may run, and neither the decoy nor this checkout may
      # change.
      - name: Run checks with a hostile environment
        run: |
          decoy="$RUNNER_TEMP/decoy"
          git init -q -b main "$decoy"
          git -C "$decoy" -c user.name=decoy -c user.email=decoy@example.invalid \
            commit -q --allow-empty -m decoy
          scripts/repo-guard snapshot "$decoy" "$RUNNER_TEMP/decoy.snapshot"
          printf 'echo ran >"%s"\n' "$RUNNER_TEMP/startup-ran" >"$RUNNER_TEMP/startup"
          BASH_ENV="$RUNNER_TEMP/startup" ENV="$RUNNER_TEMP/startup" \
            GIT_DIR="$decoy/.git" GIT_WORK_TREE="$decoy" GIT_INDEX_FILE="$decoy/.git/index" \
            mise exec -- sh scripts/test
          test ! -e "$RUNNER_TEMP/startup-ran"
          scripts/repo-guard verify "$decoy" "$RUNNER_TEMP/decoy.snapshot"

  # The required status check: passes only when every test job succeeded; a
  # failed, cancelled or skipped job, or a missing result, fails it.
  check:
    name: Check
    if: always()
    needs: [test-macos, test-linux, test-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the test jobs
        env:
          RESULTS: ${{ needs.test-macos.result }} ${{ needs.test-linux.result }} ${{ needs.test-windows.result }}
        run: |
          echo "test-macos, test-linux, test-windows: $RESULTS"
          # shellcheck disable=SC2086 # one word per job
          set -- $RESULTS
          test "$#" -eq 3
          for result in "$@"; do
            test "$result" = success
          done
