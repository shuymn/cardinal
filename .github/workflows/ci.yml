name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: rust

      # The toolchain is part of the key through mise.lock, so a toolchain
      # update starts a fresh target directory.
      - name: Compute cache key
        id: cache-key
        env:
          LOCK_HASH: ${{ hashFiles('Cargo.lock', 'mise.lock') }}
        run: |
          if [ -z "$LOCK_HASH" ]; then
            echo "Cargo.lock or mise.lock is missing" >&2
            exit 1
          fi
          echo "key=cargo-$RUNNER_OS-$RUNNER_ARCH-$LOCK_HASH" >>"$GITHUB_OUTPUT"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache-key.outputs.key }}

      - name: Check formatting
        run: mise exec -- cargo fmt --all --check

      - name: Run clippy
        run: mise exec -- cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: mise exec -- cargo test --locked

  # The required status check: passes only when every matrix leg passed.
  check:
    name: Check
    if: always()
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check matrix result
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "test: $RESULT"
          test "$RESULT" = success
