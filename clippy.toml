# Processes start only through the spawn API of crates/test-support (docs/architecture.md
# section 13.3) and at product spawn sites, each of which carries
# `#[expect(clippy::disallowed_methods, reason = "…")]`.
disallowed-methods = [
  { path = "std::process::Command::new", reason = "start processes through cardinal_test_support::Scope::command, or mark a product spawn site with #[expect]" },
  { path = "std::process::Command::spawn", reason = "start processes through cardinal_test_support::Scope::command, or mark a product spawn site with #[expect]" },
  { path = "std::process::Command::output", reason = "start processes through cardinal_test_support::Scope::command, or mark a product spawn site with #[expect]" },
  { path = "std::process::Command::status", reason = "start processes through cardinal_test_support::Scope::command, or mark a product spawn site with #[expect]" },
  { path = "assert_cmd::Command::new", reason = "start processes through cardinal_test_support::Scope::command" },
  { path = "assert_cmd::Command::cargo_bin", reason = "start processes through cardinal_test_support::Scope::command" },
  { path = "assert_cmd::Command::from_std", reason = "start processes through cardinal_test_support::Scope::command" },
  { path = "assert_cmd::cargo::cargo_bin_cmd", reason = "start processes through cardinal_test_support::Scope::command" },
]
