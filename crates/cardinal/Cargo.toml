[package]
name = "cardinal"
description = "Local compute-resource arbitration and housekeeping for parallel coding agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Doc comments carry no examples to run; cargo-nextest does not run doctests.
[lib]
doctest = false

[dependencies]
base64.workspace = true
clap.workspace = true
dunce.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
# Reading a signal's disposition (`sigaction` without a new action), and blocking signals while
# their handlers are installed (`pthread_sigmask`).
libc.workspace = true
rustix = { workspace = true, features = ["fs"] }
signal-hook.workspace = true

# The important-usage capacity of the volume holding a path (`os::disk`).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
cardinal-test-support.workspace = true
proptest.workspace = true
pulldown-cmark.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
# Reading a signal's disposition in a helper process, independently of the product.
libc.workspace = true
# Reading a stopped child's report, and the sessions of a test's processes.
rustix.workspace = true

[lints]
workspace = true
