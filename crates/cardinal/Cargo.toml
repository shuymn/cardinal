[package]
name = "cardinal"
description = "Local compute-resource arbitration and housekeeping for parallel coding agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Doc comments carry no examples to run; cargo-nextest does not run doctests.
[lib]
doctest = false

[dependencies]
base64.workspace = true
clap.workspace = true
dunce.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true
signal-hook.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
cardinal-test-support.workspace = true
proptest.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
# Pseudo-terminals for the TTY passthrough tests.
rustix = { workspace = true, features = ["pty"] }

[lints]
workspace = true
